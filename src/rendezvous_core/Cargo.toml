[package]
name = "rendezvous_core"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"

[lib]
name = "rendezvous_core"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3